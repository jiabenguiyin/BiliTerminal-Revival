plugins {
    id 'com.android.application'
}

int betaVer = 0

android {

    namespace 'com.RobinNotBad.BiliClient'
    //noinspection GradleDependency
    compileSdk 33

    sourceSets {
        main{
            jniLibs.srcDirs = ['libs']
            java {
                exclude '**/GeetestUtil.java'
            }
        }
    }

    defaultConfig {
        applicationId "com.RobinNotBad.BiliClient"
        // Keep the original package compatibility floor used by BiliClient.
        minSdk 14
        //noinspection ExpiredTargetSdkVersion
        targetSdk 26
        versionCode 2026080201
        versionName "1.1.1"

        if (betaVer) {
            versionName += "-BETA" + betaVer
        }

        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            //noinspection ChromeOsAbiSupport
            // Preserve the original ABI metadata for older watch compatibility.
            abiFilters 'armeabi-v7a', 'x86', 'mips'
        }

        resConfigs 'zh'
    }

    signingConfigs {
        release {
            def localProps = project.rootProject.file("local.properties")
            def signingProperties = new Properties()
            if (localProps.exists()) {
                signingProperties.load(localProps.newDataInputStream())
            }
            if (signingProperties.hasProperty("KEY_PATH")) {
                storeFile file(signingProperties.getProperty("KEY_PATH"))
                storePassword signingProperties.getProperty("KEY_PASSWORD")
                keyAlias signingProperties.getProperty("ALIAS_NAME")
                keyPassword signingProperties.getProperty("ALIAS_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            buildConfigField "boolean", "LOG_DEBUG", "false"
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def localProps = project.rootProject.file("local.properties")
            def signingProperties = new Properties()
            if (localProps.exists()) {
                signingProperties.load(localProps.newDataInputStream())
            }
            if (signingProperties.hasProperty("KEY_PATH")) {
                signingConfig signingConfigs.release
            } else {
                // Historical releases used the project's debug certificate. Keep the
                // fallback so release APKs remain installable without a private keystore.
                signingConfig signingConfigs.debug
            }
        }
        debug {
            buildConfigField "boolean", "BETA", String.valueOf(betaVer > 0)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_9
        targetCompatibility JavaVersion.VERSION_1_9
    }

    packagingOptions {
        exclude 'META-INF/androidx.cardview_cardview.version'
    }
    buildFeatures {
        viewBinding false
    }
    lintOptions {
        // Date-based version codes are intentional; DanmakuView is supplied by the local module.
        disable 'HighAppVersionCode', 'MissingClass'
    }
}

dependencies {
    //noinspection GradleDependency
    implementation 'com.google.zxing:core:3.3.0'
    //noinspection GradleDependency
    implementation 'androidx.appcompat:appcompat:1.5.1'
    //noinspection GradleDependency
    implementation 'com.google.android.material:material:1.9.0'
    //noinspection GradleDependency
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'com.github.bumptech.glide:glide:4.13.2'
    implementation 'com.github.bumptech.glide:okhttp3-integration:4.13.2'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.13.2'
    //noinspection GradleDependency
    implementation 'org.jsoup:jsoup:1.10.2'
    //noinspection GradleCompatible
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'org.greenrobot:eventbus:3.2.0'
    // Geetest（目前没用到）
    //implementation 'com.geetest.sensebot:sensebot:4.4.2.1'
    //danmaku
    //implementation 'com.github.ctiao:DanmakuFlameMaster:0.9.25'
    //implementation 'com.github.ctiao:ndkbitmap-armv7a:0.9.21'
    //implementation 'com.github.ctiao:ndkbitmap-x86:0.9.21'
    //ijk
    implementation project(path: ':ijkplayer-java')
    implementation project(path: ':DanmakuFlameMaster')
    implementation project(path: ':brotlij')
    implementation 'androidx.asynclayoutinflater:asynclayoutinflater:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    def multidex_version = "2.0.1"
    implementation "androidx.multidex:multidex:$multidex_version"
    implementation "org.brotli:dec:0.1.2"
    implementation "com.aayushatharva.brotli4j:brotli4j:1.16.0"
    implementation 'com.google.protobuf:protobuf-javalite:3.21.12'
    implementation 'org.apache.commons:commons-compress:1.21'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.3.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
}
